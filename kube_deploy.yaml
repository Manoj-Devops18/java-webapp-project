apiVersion: apps/v1
kind: Deployment
metadata:
  name: manoj-eta-deploy
  labels:
    app: manoj-eta-deploy-lbl
spec:
  replicas: 3
  selector:
    matchLabels:
      app: manoj-eta-app
  template:
    metadata:
      labels:
        app: manoj-eta-app
    spec:
      containers:
      - name: manoj-eta-container
        image: manojdevops18/pl-java-web-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: manoj-eta-np-service
  labels:
    app: manoj-eta-app
spec:
  selector:
    app: manoj-eta-deploy-lbl

  type: NodePort
  ports:
  - nodePort: 31028
    port: 8080
    targetPort: 8080
